# SPDX-License-Identifier: MIT
name: MSVDX userspace checks
permissions:
  contents: read
on:
  workflow_dispatch:
  pull_request:
    paths: ['video/**', '.github/workflows/msvdx-userspace.yml']
  push:
    paths: ['video/**', '.github/workflows/msvdx-userspace.yml']
jobs:
  cpu:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install build dependencies
        run: sudo apt-get update && sudo apt-get install -y build-essential pkg-config libva-dev libdrm-dev python3
      - name: Build and run CPU checks
        run: make -C video -j2 check
      - name: Stage userspace without installing it
        run: make -C video DESTDIR="$PWD/build/video-package" install
